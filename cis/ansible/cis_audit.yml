---
# Audit of the CIS Level 1 aligned baseline (subset of controls). Read-only.
# Exits non-zero when a control fails, unless -e cis_audit_strict=false.
# Run through ./deploy.sh cis-audit (or ./cis/audit.sh).

- name: Audit the CIS Level 1 aligned baseline (subset of controls)
  hosts: all
  become: true
  gather_facts: true
  roles:
    - role: common
  tasks:
    - name: Run the baseline audit tasks
      ansible.builtin.include_tasks: tasks/audit.yml
