---
name: CI

permissions:
  contents: read

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    env:
      ANSIBLE_CONFIG: ansible/ansible.cfg
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shellcheck
        run: shellcheck deploy.sh scripts/*.sh cis/*.sh tofu/scripts/*.sh tofu/scripts/tests/*.sh tofu/esxi/scripts/*.sh tofu/esxi/scripts/tests/*.sh

      # The shell side of the provisioning modules, with fake ssh, scp,
      # qemu-img and tofu: no host is contacted.
      - name: Provisioning script tests
        run: |
          tofu/esxi/scripts/tests/esxi-scripts-test.sh
          tofu/scripts/tests/deploy-tools-test.sh

      # A dedicated interpreter (the system Python of the runner is externally
      # managed) and pinned tools, so a new linter release cannot fail the
      # build without a change in this repository.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible-core==2.21.4 ansible-lint==26.9.0 yamllint==1.38.0
          ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint .

      # An unquoted condition containing ": " parses as a mapping and only fails at run time.
      - name: Conditions are strings
        run: python .github/scripts/check_conditionals.py

      # ansible-lint follows include_tasks and roles, so a broken task file
      # fails here even though --syntax-check alone would not notice it.
      - name: ansible-lint
        run: >-
          ansible-lint
          ansible/site.yml
          ansible/add_worker.yml
          ansible/remove_worker.yml
          ansible/verify_hosts.yml
          cis/ansible/cis_hardening.yml
          cis/ansible/cis_audit.yml

      - name: Playbook syntax check
        run: |
          for playbook in \
            ansible/site.yml \
            ansible/add_worker.yml \
            ansible/remove_worker.yml \
            ansible/verify_hosts.yml \
            cis/ansible/cis_hardening.yml \
            cis/ansible/cis_audit.yml; do
            ansible-playbook -i inventory.example.ini --syntax-check "$playbook"
          done

  # The provisioning modules are checked without a provider endpoint, one matrix
  # entry per module: formatting, init (providers only, no backend), validate
  # and the tofu test files, which run against mocked providers. An entry whose
  # directory does not exist yet is skipped.
  opentofu:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [modules/layout, proxmox, nutanix, esxi, vsphere]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false

      # The VMware modules build their OVA on the operator's computer: the
      # builder is checked once, on a tiny image (needs qemu-img and xmllint).
      - name: OVA builder test
        if: matrix.module == 'vsphere'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-utils libxml2-utils
          tofu/scripts/tests/build-ova-test.sh

      - name: tofu fmt
        if: hashFiles(format('tofu/{0}/*.tf', matrix.module)) != ''
        run: tofu fmt -check -recursive tofu/${{ matrix.module }}

      - name: tofu init, validate and test
        if: hashFiles(format('tofu/{0}/*.tf', matrix.module)) != ''
        run: |
          tofu -chdir=tofu/${{ matrix.module }} init -backend=false -input=false
          tofu -chdir=tofu/${{ matrix.module }} validate
          tofu -chdir=tofu/${{ matrix.module }} test
