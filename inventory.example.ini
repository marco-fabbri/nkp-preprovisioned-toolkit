# ==============================================================================
# NKP Preprovisioned Toolkit - inventory template
# ==============================================================================
# Copy to inventory.ini (gitignored) and run: chmod 600 inventory.ini
# The addresses below are examples. Node, VIP and MetalLB addresses must not
# fall inside the Pod CIDR (192.168.0.0/16) or the Service CIDR (10.96.0.0/12).
# Hosts created with the OpenTofu modules: "tofu output -raw ansible_inventory"
# prints the groups and the [all:vars] stub for them (see tofu/README.md).

[jump_host]
# Exactly one host: bastion and temporary KIND bootstrap
nkp-jump-host ansible_host=10.10.10.80

[control_plane]
# 1, 3 or 5 hosts (3 or 5 for an etcd quorum)
nkp-cp-01 ansible_host=10.10.10.81
nkp-cp-02 ansible_host=10.10.10.82
nkp-cp-03 ansible_host=10.10.10.83

[workers]
# At least one host; two or more for the Kommander platform services. The NKP
# guide lists four for Pro and Ultimate clusters (one Ceph OSD each).
nkp-worker-01 ansible_host=10.10.10.86
nkp-worker-02 ansible_host=10.10.10.87

[nkp_nodes:children]
control_plane
workers

[all:vars]
# Operating system and hardening profile. All hosts must run the same OS.
#   rocky       Rocky Linux 9
#   ubuntu      Ubuntu 24.04 LTS
#   rocky-cis   Rocky Linux 9 + CIS Level 1 aligned baseline (subset of controls)
#   ubuntu-cis  Ubuntu 24.04 LTS + CIS Level 1 aligned baseline (subset of controls)
# The -cis profiles apply and audit the baseline described in cis/README.md.
# They do not make a host CIS compliant.
os_profile = rocky

# OS user on every host. It must exist, accept your SSH key and have
# passwordless sudo.
ansible_user = nutanix

cluster_name = nkp-cluster

# Control plane endpoint managed by kube-vip: an unused address in the node
# subnet, outside the MetalLB pool.
control_plane_vip = 10.10.10.85
# Network interface of the control plane nodes that carries the VIP.
# Check the name with "ip -br a" on a control plane node (ens192, enp1s0, eth0...).
virtual_ip_interface = eth0

# MetalLB Layer 2 address pool (NKP dashboard and LoadBalancer services).
# Unused addresses in the node subnet; no host or VIP address inside the range.
metallb_ip_range = 10.10.10.90-10.10.10.99

# NKP CLI for Linux amd64, obtained from the Nutanix Support Portal (see
# downloads/README.md). The checksums below were computed by the author on the
# v2.18.0 linux/amd64 CLI; the authoritative values are those published by
# Nutanix. Update them for any other build.
nkp_binary_local_path = downloads/nkp
nkp_binary_md5 = deeb16aa4cf913e44222b67f97335888
nkp_binary_sha256 = 984259bf0efb56ab8ac08f96f1ba9f1e32080af94fd0b82b8a71ffd1501ff564

# NKP licence: not set here. The licence is bound to the Cluster UUID, which
# exists only once the cluster is created: the installation prints it, and you
# activate your licence in the NKP dashboard (see README.md, Licensing).

# ------------------------------------------------------------------------------
# Optional overrides. The values shown are the defaults, unless the comment
# above a line says "Example".
# ------------------------------------------------------------------------------
# Password set for ansible_user on every host (console / SSH fallback).
# Change it for anything beyond a lab; an empty value leaves the password untouched.
# vm_default_password = nutanix/4u
# true writes "PasswordAuthentication yes" to an sshd drop-in on every host,
# false writes "PasswordAuthentication no". Use false for anything beyond a lab.
# ssh_password_authentication = true

# Node subnet trusted by the host firewall rules. Default: the subnet of each
# host's default-route interface. Example:
# node_subnet_cidr = 10.10.10.0/24
# Kubernetes Pod and Service networks. They can only be chosen before the
# cluster is created.
# pod_cidr = 192.168.0.0/16
# service_cidr = 10.96.0.0/12

# kubectl client installed on the jump host.
# kubectl_version = v1.35.2

# SSH identity used by Cluster API from the jump host to the nodes. Defaults:
# ansible_user and /home/<ansible_user>/.ssh/id_rsa. The key pair is created at
# this path when it does not exist; an existing key that is not RSA 4096 without
# passphrase is never overwritten (the run stops). Write a literal absolute path,
# without references to other variables. For a new installation a dedicated key
# is recommended; do not change the path of an existing cluster. Example:
# cluster_ssh_user = nutanix
# cluster_ssh_key_path = /home/nutanix/.ssh/nkp_cluster_key

# Worker disks (layout of the NKP 2.18 guide, see "Worker disks" in README.md):
# the OS disk, one raw disk for the Ceph OSD, one disk per local volume. The
# toolkit never partitions a disk. Each value is a kernel name without /dev/
# (sdb) or an absolute path (/dev/disk/by-id/..., /dev/disk/by-path/...,
# /dev/sdb), and must designate the same disk on every worker.
#
# Recommended: /dev/disk/by-id paths (ls -l /dev/disk/by-id/ on a worker).
# Kernel names follow the order in which the kernel detects the disks, not the
# hypervisor slot, and can change at the next boot: on a Proxmox lab worker the
# local volume disk in slot scsi2 came up as sdb and the Ceph disk in scsi1 as
# sdc. The defaults (sdb, sdc..sdf) are kept for compatibility and make the
# preflight print a warning. Every value is resolved on each worker before use;
# the run stops when one resolves to no whole disk, to the same disk as another
# value or to the disk holding /. The ansible_inventory output of the OpenTofu
# modules already uses the by-id links.
#
# Disk each worker gives to Rook Ceph: a raw disk (no partitions, no partition
# table, no file system, at least 40 GiB). A disk once initialised with
# gdisk/parted must be cleared first (wipefs --all or sgdisk --zap-all).
# Recommended form (Proxmox serial nkp-ceph), then the default:
# ceph_osd_device = /dev/disk/by-id/scsi-SQEMU_QEMU_HARDDISK_nkp-ceph
# ceph_osd_device = sdb
# Disks each worker gives to the local volume provisioner, volume N = N-th
# entry (mounted at /mnt/disks/volN, whatever the kernel name of the disk). A
# blank disk is formatted whole with local_volume_fstype and mounted by UUID; a
# disk that already carries that file system is left untouched; anything else
# stops the run. Give them more than 100 GiB each (for example 110 GB):
# Prometheus claims exactly 100 GiB and the file system is a little smaller
# than the disk. JSON list on one line; recommended form (Proxmox serials
# nkp-vol1..nkp-vol4), then the default:
# local_volume_devices = ["/dev/disk/by-id/scsi-SQEMU_QEMU_HARDDISK_nkp-vol1", "/dev/disk/by-id/scsi-SQEMU_QEMU_HARDDISK_nkp-vol2", "/dev/disk/by-id/scsi-SQEMU_QEMU_HARDDISK_nkp-vol3", "/dev/disk/by-id/scsi-SQEMU_QEMU_HARDDISK_nkp-vol4"]
# local_volume_devices = ["sdc", "sdd", "sde", "sdf"]
# local_volume_min_gib = 100
# local_volume_fstype = xfs
# local_volume_mount_prefix = /mnt/disks/vol
#
# Lab shortcuts (opt-in, adequate for a lab only). Clusters built with earlier
# revisions of this toolkit used both by default: set them before running
# install or a Day-2 command on such a cluster.
# Ceph on a loop device backed by a sparse file of the worker root disk:
# ceph_osd_device = ""
# Local volumes as ten bind-mounted directories of the root file system
# (/var/local-disks/vol1..vol10, on every node); the file system holding them
# then needs at least 120 GB on each worker:
# local_volume_devices = []

# Size thresholds of the preflight: the Pro and Ultimate requirements of the NKP
# 2.18 guide, slightly below the nominal RAM because the kernel reports less
# than the memory assigned (see "Hosts" in README.md). A smaller lab may lower
# single values knowingly; the platform applications may then lack resources.
# preflight_control_plane_min_vcpus = 4
# preflight_control_plane_min_mem_mb = 15000
# preflight_worker_min_vcpus = 8
# preflight_worker_min_mem_mb = 30000
# preflight_jump_host_min_vcpus = 4
# preflight_jump_host_min_mem_mb = 7500
# Workers listed by the guide; fewer only produce a warning.
# preflight_recommended_workers = 4
# Skip the vCPU, RAM and disk size thresholds of the preflight (every other check
# still runs). Set by ./deploy.sh tofu-verify; NKP must not be installed on
# hosts that only pass this way.
# preflight_skip_sizing = false

# Provisioning with OpenTofu (./deploy.sh tofu-*): directory under tofu/ of the
# provider module (proxmox, nutanix, esxi or vsphere), and the sizing_profile of the module (pro-ultimate, or
# contract-test for VMs meant for tofu-verify only). The tofu-* commands read
# these two keys and os_profile from this file; Ansible ignores them.
# tofu_provider = proxmox
# tofu_sizing_profile = pro-ultimate

# Customisations of the generated Kommander installer configuration
# (~/nkp/kommander.yaml on the jump host, rewritten on every run). A JSON
# object on one line with the layout of that file, merged last. Example:
# kommander_deploy_installer_overrides = {"apps": {"kube-prometheus-stack": {"enabled": false}}}

# Host firewall on cluster nodes. The NKP guide requires firewalld to be
# disabled on pre-provisioned machines, so by default the toolkit never enables
# a firewall on a node; one that is already active only gets the rules the
# cluster needs. See "Host firewalls on cluster nodes" in README.md.
# Rocky nodes where firewalld runs: masquerading in the default zone
# (true = enabled, false = disabled).
# node_firewalld_masquerade = true

# CIS profiles only (see cis/README.md).
# Install and enable the host firewall on cluster nodes too (Rocky: firewalld,
# Ubuntu: UFW). Outside the vendor prerequisites.
# cis_firewalld_on_nodes = false
# cis_ufw_on_nodes = false
# Extra networks trusted by the node firewall when it is enabled. Default: an
# empty list. Example:
# cis_extra_trusted_cidrs = ["10.20.0.0/24"]
# cis_audit_strict = true
