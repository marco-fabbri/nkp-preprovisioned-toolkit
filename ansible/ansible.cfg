[defaults]
inventory = ../inventory.ini
roles_path = roles
# Host key checking is disabled on purpose: the toolkit targets lab and PoC
# environments where VMs are rebuilt often and reuse the same addresses.
# On a network you do not fully trust, set this to True and remove the
# StrictHostKeyChecking / UserKnownHostsFile options from ssh_args below.
host_key_checking = False
retry_files_enabled = False
stdout_callback = default
callback_result_format = yaml
interpreter_python = auto_silent
timeout = 30
forks = 10

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
