---
# Location of the SSH public key generated by the jump_host role. The path is
# resolved with the jump host's own variables, not those of the node.
#
# Role defaults are not visible through hostvars, so the path comes from, in
# this order: the fact recorded on the jump host by the preflight role (always
# right, whatever cluster_ssh_key_path refers to), cluster_ssh_key_path set in
# the inventory, and last the built-in default of role "common". The last two
# are only used when the jump host was left out of the run (--limit).
node_prep_jump_host: "{{ groups['jump_host'][0] }}"
node_prep_jump_host_home: >-
  {{ hostvars[node_prep_jump_host]['nkp_user_home']
     | default('/home/' ~ hostvars[node_prep_jump_host]['ansible_user']) }}
node_prep_jump_host_pubkey_path: >-
  {{ hostvars[node_prep_jump_host]['preflight_cluster_ssh_key_path']
     | default(hostvars[node_prep_jump_host]['cluster_ssh_key_path']
               | default(node_prep_jump_host_home ~ '/.ssh/id_rsa')) }}.pub

# SSH port kept open in the host firewall: the one Ansible connects to.
node_prep_ssh_port: "{{ ansible_port | default(22) | int }}"

# Local volume device being set up (local_volume_device.yml): its kernel name
# and its mount point. node_prep_volume is the loop entry, its volume number
# is the position of the value in local_volume_devices (from 1).
node_prep_volume_device: "{{ node_prep_volume.name }}"
node_prep_volume_path: "{{ local_volume_mount_prefix }}{{ node_prep_volume.volume }}"
