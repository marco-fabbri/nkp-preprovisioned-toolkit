---
# NKP 2.19 and later: a connected cluster without a registry mirror pulls its
# platform images from docker.io/nutanix with the Nutanix Docker Hub
# credentials, kept in the Secret <cluster>-dockerhub-nutanix-credentials of
# each cluster. "nkp upgrade kommander" stops when a cluster of the fleet has
# none, so they are written before it. The CLI takes them on the command line
# only: no_log keeps them out of the output, and they stay visible to other
# local users of the jump host in the process list while the command runs.

- name: Look for the Nutanix Docker Hub credentials of the cluster
  ansible.builtin.command:
    argv: >-
      {{ cluster_upgrade_kubectl + ['-n', cluster_upgrade_namespace, 'get', 'secret',
         cluster_name ~ '-dockerhub-nutanix-credentials', '--ignore-not-found', '-o', 'name'] }}
  register: cluster_upgrade_registry_secret
  changed_when: false

- name: Write the Nutanix Docker Hub credentials on every cluster of the fleet
  when: >-
    cluster_upgrade_registry_secret.stdout | trim | length == 0
    or cluster_upgrade_rotate_registry_credentials | bool
  block:
    - name: Run nkp update cluster nutanix-registry-credentials
      ansible.builtin.command:
        argv:
          - "{{ cluster_upgrade_nkp }}"
          - update
          - cluster
          - nutanix-registry-credentials
          - --all-namespaces
          - --nutanix-registry-username
          - "{{ nutanix_registry_username }}"
          - --nutanix-registry-password
          - "{{ nutanix_registry_password }}"
          - --kubeconfig
          - "{{ cluster_kubeconfig }}"
        chdir: "{{ nkp_workdir }}"
      changed_when: true
      no_log: true
  rescue:
    # The failed result keeps the real output under no_log; the password is
    # masked in case the CLI echoes it.
    - name: Report the failure
      vars:
        cluster_upgrade_registry_output: >-
          {{ (ansible_failed_result.stderr_lines | default([ansible_failed_result.msg | default('no output')]))[-15:]
             | join(' | ') }}
      ansible.builtin.fail:
        msg: >-
          'nkp update cluster nutanix-registry-credentials' failed (rc={{ ansible_failed_result.rc | default('n/a') }}):
          {{ cluster_upgrade_registry_output | replace(nutanix_registry_password, '****')
             if nutanix_registry_password | length > 0 else cluster_upgrade_registry_output }}.
          Check NUTANIX_REGISTRY_USERNAME and NUTANIX_REGISTRY_PASSWORD (Nutanix Docker Hub user name and access
          token from the NKP downloads page of the Support Portal).
