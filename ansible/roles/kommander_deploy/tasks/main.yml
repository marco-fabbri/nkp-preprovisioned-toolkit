---
# ==============================================================================
# Role: kommander_deploy - Install Kommander Platform Services
# ==============================================================================
# Requires the "common" role defaults (cluster_kubeconfig, nkp_workdir).

- name: Check if Kommander is already installed on the cluster
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ cluster_kubeconfig }}"
      - -n
      - kommander
      - get
      - svc
      - kommander-traefik
      - --ignore-not-found
      - -o
      - name
  become: false
  register: kommander_deploy_installed_check
  changed_when: false

# The installer configuration below comes from the CLI of nkp_version, and a
# changed file re-runs "nkp install kommander": on a cluster that runs another
# release that would install over it instead of following the upgrade path.
- name: Refuse to install Kommander over another NKP release
  when: kommander_deploy_installed_check.stdout | trim | length > 0
  block:
    - name: Read the Kommander release on the cluster
      ansible.builtin.include_role:
        name: common
        tasks_from: kommander_version

    - name: Verify the cluster runs release {{ nkp_version }}
      ansible.builtin.assert:
        that:
          - common_kommander_version | length == 0 or common_kommander_version == nkp_version
        fail_msg: >-
          Cluster '{{ cluster_name }}' runs NKP {{ common_kommander_version }} and inventory.ini sets
          nkp_version {{ nkp_version }}. ./deploy.sh install does not change the release of an existing cluster:
          run ./deploy.sh upgrade to move it to {{ nkp_version }}, or set nkp_version back to
          {{ common_kommander_version }} to re-run the installation.
        quiet: true

# The default Ceph configuration asks for block-mode volumes, which the local
# static provisioner of pre-provisioned clusters cannot provide. The NKP guide
# prescribes host storage mode instead: Ceph takes the node devices matching
# a filter (ceph_device_filter for a kernel name, ceph_device_path_filter for an
# absolute path, see role "common"). Rook never selects a loop device through a
# filter, so the lab shortcut names the device explicitly. Only workers are
# checked for the
# device, so the OSD placement keeps Rook off the control plane nodes.
- name: Generate the default Kommander installer configuration
  ansible.builtin.command:
    argv: ['nkp', 'install', 'kommander', '--init']
    chdir: "{{ nkp_workdir }}"
  become: false
  register: kommander_deploy_init
  changed_when: false

# The file is regenerated on every run: customisations go through
# kommander_deploy_installer_overrides, combined last.
- name: Write the Kommander installer configuration with Ceph in host storage mode
  vars:
    kommander_deploy_ceph_values_disk: |
      cephClusterSpec:
        placement:
          osd:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
        storage:
          storageClassDeviceSets: []
          useAllNodes: true
          useAllDevices: false
          {{ kommander_deploy_ceph_selector }}
    # A kernel name selects the disk by name (deviceFilter); an absolute path
    # such as /dev/disk/by-id/... selects it by link (devicePathFilter: Rook
    # matches it against /dev/<name> and the /dev/disk/by-* links of each
    # device). to_json writes a YAML-safe double-quoted string, backslashes of
    # the escaped path included.
    kommander_deploy_ceph_selector: >-
      {{ ('devicePathFilter: ' ~ (ceph_device_path_filter | to_json)) if ceph_osd_device is match('/')
         else ('deviceFilter: ' ~ (ceph_device_filter | to_json)) }}
    kommander_deploy_ceph_values_loop: |
      cephClusterSpec:
        placement:
          osd:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: node-role.kubernetes.io/control-plane
                        operator: DoesNotExist
        storage:
          storageClassDeviceSets: []
          useAllNodes: true
          useAllDevices: false
          devices:
            - name: "/dev/{{ ceph_loop_device_name }}"
    kommander_deploy_ceph_app:
      apps:
        rook-ceph-cluster:
          enabled: true
          values: "{{ kommander_deploy_ceph_values_disk if ceph_osd_device | length > 0 else kommander_deploy_ceph_values_loop }}"
    # A JSON string (inventory.ini) is accepted as well as a dict (-e or YAML).
    kommander_deploy_overrides: >-
      {{ kommander_deploy_installer_overrides | from_yaml
         if kommander_deploy_installer_overrides is string else kommander_deploy_installer_overrides }}
  ansible.builtin.copy:
    dest: "{{ kommander_deploy_installer_config }}"
    content: >-
      {{ kommander_deploy_init.stdout | from_yaml
         | combine(kommander_deploy_ceph_app, kommander_deploy_overrides, recursive=true) | to_nice_yaml(indent=2) }}
    mode: '0644'
  become: false
  register: kommander_deploy_config_file

# Also runs when the configuration changed: the guide allows re-running the
# installer to reconfigure the applications.
- name: Execute nkp install kommander
  ansible.builtin.command:
    argv:
      - nkp
      - install
      - kommander
      - --installer-config
      - "{{ kommander_deploy_installer_config }}"
      - --wait=false
      - --kubeconfig
      - "{{ cluster_kubeconfig }}"
    chdir: "{{ nkp_workdir }}"
  become: false
  when: kommander_deploy_installed_check.stdout | trim | length == 0 or kommander_deploy_config_file is changed
  changed_when: true

# From NKP 2.19 the Kommander installation writes the Cluster API stack again
# (manager "ManagementPlane" of the capi-stack object), and NKP 2.19.0 gives
# the pre-provisioned provider an image builder tag without entrypoint: no new
# machine could be prepared afterwards (add-worker, remediation, upgrades).
# Wait for that write, a few minutes after the installer starts, then correct
# the tag (task file of role "common").
- name: Keep new machines possible after the Kommander installation
  when: nkp_version is version('2.19.0', '>=')
  block:
    - name: Wait for the management plane to write the Cluster API stack
      ansible.builtin.command:
        argv:
          - kubectl
          - --kubeconfig
          - "{{ cluster_kubeconfig }}"
          - --request-timeout=60s
          - get
          - capistacks.nkp.nutanix.com
          - capi-stack
          - --ignore-not-found
          - --show-managed-fields
          - -o
          - jsonpath={.metadata.managedFields[*].manager}
      become: false
      register: kommander_deploy_capistack_managers
      until: "'ManagementPlane' in kommander_deploy_capistack_managers.stdout.split()"
      retries: 60
      delay: 20
      changed_when: false
      failed_when: false

    - name: Report a management plane that did not write the Cluster API stack
      when: "'ManagementPlane' not in kommander_deploy_capistack_managers.stdout.split()"
      ansible.builtin.debug:
        msg: >-
          WARNING: after 20 minutes the management plane had not written the Cluster API stack (capi-stack).
          The image builder tag of the pre-provisioned provider is checked now and may be changed again later:
          run ./deploy.sh install --tags kommander_deploy once the installation has settled.

    - name: Check the image builder of the pre-provisioned provider
      ansible.builtin.include_role:
        name: common
        tasks_from: provisioner_image

- name: Print the summary of the cluster
  ansible.builtin.include_tasks: summary.yml
