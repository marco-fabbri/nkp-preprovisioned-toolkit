---
# ==============================================================================
# Role: kommander_deploy - summary of a running cluster
# ==============================================================================
# Included at the end of the installation (main.yml) and after an upgrade
# (upgrade.yml, include_role tasks_from: summary). Read-only, except the reset
# of the HelmReleases Flux stopped retrying. Requires the "common" role
# defaults (cluster_kubeconfig).

# Not fatal on timeout: the summary banner reports the address as pending.
- name: Wait for external IP assignment to Traefik Ingress service
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ cluster_kubeconfig }}"
      - -n
      - kommander
      - get
      - svc
      - kommander-traefik
      - -o
      - jsonpath={.status.loadBalancer.ingress[0].ip}
  become: false
  register: kommander_deploy_traefik_ip
  until: kommander_deploy_traefik_ip.rc == 0 and kommander_deploy_traefik_ip.stdout | trim | length > 0
  retries: 60
  delay: 10
  changed_when: false
  failed_when: false

# ------------------------------------------------------------------------------
# License: never applied or changed by this toolkit. The licence is bound to the
# Cluster UUID, the UID of the Cluster API "Cluster" object the NKP CLI
# created (the identifier the Nutanix licensing KB asks for), which exists only
# once the cluster is created: the summary prints it with the activation steps.
# ------------------------------------------------------------------------------
- name: Read the Cluster UUID (UID of the Cluster API cluster object)
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ cluster_kubeconfig }}"
      - get
      - clusters.cluster.x-k8s.io
      - --all-namespaces
      - -o
      - jsonpath={.items[0].metadata.uid}
  become: false
  register: kommander_deploy_cluster_uuid
  changed_when: false
  failed_when: false

# Read-only and best effort: the banner prints "unknown" when the query fails.
- name: Query license status reported by Kommander
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ cluster_kubeconfig }}"
      - -n
      - kommander
      - get
      - license.kommander.mesosphere.io
      - >-
        -o=jsonpath={range .items[*]}{.metadata.name}: tier={.status.dkpLevel} valid={.status.valid}
        licenseId={.status.licenseId} clusters={.status.clusterCapacity} cores={.status.coreCapacity}{"\n"}{end}
  become: false
  register: kommander_deploy_license_status_out
  until: kommander_deploy_license_status_out.rc == 0
  retries: 6
  delay: 10
  changed_when: false
  failed_when: false

# Read-only and best effort. Kommander is installed with --wait=false, so an
# address on the ingress service does not mean the applications are ready: the
# banner title is "successfully" only when every HelmRelease reports Ready.
# A slow start (image pulls, probes) can make a Helm action time out. Flux then
# marks the release "Stalled" and stops retrying, even once the application
# runs. Resetting the failure counters makes it reconcile again.
- name: Read the Kommander HelmReleases
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ cluster_kubeconfig }}"
      - -n
      - kommander
      - get
      - helmreleases.helm.toolkit.fluxcd.io
      - -o
      - 'jsonpath={range .items[*]}{.metadata.name}={.status.conditions[?(@.type=="Stalled")].status}{"\n"}{end}'
  become: false
  register: kommander_deploy_helmreleases
  changed_when: false
  failed_when: false

# Flux honours resetAt and forceAt only when they equal requestedAt: one value for all three.
- name: Pick one timestamp for the Flux reset annotations
  ansible.builtin.set_fact:
    kommander_deploy_now: "{{ now(utc=true, fmt='%s') }}"

- name: Reset the HelmReleases Flux stopped retrying
  vars:
    kommander_deploy_stalled: >-
      {{ kommander_deploy_helmreleases.stdout_lines | default([]) | select('match', '.+=True$')
         | map('regex_replace', '=True$', '') | list
         if kommander_deploy_helmreleases.rc == 0 else [] }}
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ cluster_kubeconfig }}"
      - -n
      - kommander
      - annotate
      - helmreleases.helm.toolkit.fluxcd.io
      - "{{ item }}"
      - --overwrite
      - "reconcile.fluxcd.io/requestedAt={{ kommander_deploy_now }}"
      - "reconcile.fluxcd.io/resetAt={{ kommander_deploy_now }}"
      - "reconcile.fluxcd.io/forceAt={{ kommander_deploy_now }}"
  become: false
  loop: "{{ kommander_deploy_stalled }}"
  changed_when: true

- name: Query the state of the Kommander applications
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig
      - "{{ cluster_kubeconfig }}"
      - -n
      - kommander
      - get
      - helmreleases.helm.toolkit.fluxcd.io
      - '-o=jsonpath={range .items[*]}{.metadata.name}={.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}'
  become: false
  register: kommander_deploy_helmreleases_out
  changed_when: false
  failed_when: false

# Opt-in (kommander_deploy_banner_show_credentials): the dashboard credentials
# grant cluster-admin and Ansible output often ends up in a log or on a shared
# screen, so by default the banner prints the command that reads them instead.
# no_log hides them in this task's output; the banner prints them on purpose.
- name: Read the dashboard credentials for the summary banner
  ansible.builtin.command:
    argv:
      - nkp
      - get
      - dashboard
      - --kubeconfig
      - "{{ cluster_kubeconfig }}"
  become: false
  register: kommander_deploy_dashboard_credentials
  when: kommander_deploy_banner_show_credentials | bool
  changed_when: false
  failed_when: false
  no_log: true

# The License resource never carries the licence id, even once a licence is
# activated: the tier tells the two states apart. Pro is the default key NKP
# assigns on non-Nutanix infrastructure; any other valid tier was activated.
- name: Compose the summary banner
  ansible.builtin.set_fact:
    kommander_deploy_banner_access: "{{ banner_access_head + banner_dashboard_credentials + banner_access_tail }}"
    kommander_deploy_banner_license_activated: "{{ banner_license_activated | bool }}"
    kommander_deploy_banner_license_activated_lines: "{{ banner_license_activated_lines }}"
    kommander_deploy_banner_license_default_lines: "{{ banner_license_default_lines }}"
  vars:
    banner_rule: "=============================================================================="
    banner_sep: "------------------------------------------------------------------------------"
    banner_jump_ip: "{{ hostvars[groups['jump_host'][0]]['ansible_host'] | default(groups['jump_host'][0], true) }}"
    banner_ingress_ip: "{{ kommander_deploy_traefik_ip.stdout | default('', true) | trim }}"
    banner_ingress_ready: "{{ banner_ingress_ip | length > 0 }}"
    banner_apps: >-
      {{ kommander_deploy_helmreleases_out.stdout_lines | default([]) | select | list
         if (kommander_deploy_helmreleases_out.rc | default(1)) == 0 else [] }}
    banner_apps_ready: "{{ banner_apps | select('match', '.*=True$') | list }}"
    banner_all_ready: >-
      {{ (banner_ingress_ready | bool) and banner_apps | length > 0
         and banner_apps_ready | length == banner_apps | length }}
    banner_apps_summary: >-
      {{ (banner_apps_ready | length ~ ' of ' ~ banner_apps | length ~ ' applications ready')
         if banner_apps | length > 0 else 'application state unknown' }}
    banner_cluster_uuid: >-
      {{ kommander_deploy_cluster_uuid.stdout | trim
         if (kommander_deploy_cluster_uuid.rc | default(1)) == 0 and kommander_deploy_cluster_uuid.stdout | trim | length > 0
         else 'unknown (run on the jump host: kubectl --kubeconfig ' ~ cluster_kubeconfig
              ~ ' get clusters.cluster.x-k8s.io -A -o jsonpath={.items[0].metadata.uid})' }}
    banner_license_status: >-
      {{
        'unknown (the license query failed)'
        if (kommander_deploy_license_status_out.rc | default(1)) != 0
        else (kommander_deploy_license_status_out.stdout_lines | default([], true) | join('; ')
              | default('no License resource found in namespace kommander', true))
      }}
    # Split rather than regex_search, as for the licence tier below.
    banner_dashboard_output: "{{ kommander_deploy_dashboard_credentials.stdout_lines | default([], true) }}"
    banner_dashboard_user: >-
      {{ banner_dashboard_output | select('match', '^Username: ') | map('regex_replace', '^Username: *', '')
         | first | default('', true) | trim }}
    banner_dashboard_password: >-
      {{ banner_dashboard_output | select('match', '^Password: ') | map('regex_replace', '^Password: *', '')
         | first | default('', true) | trim }}
    banner_dashboard_show: >-
      {{ (kommander_deploy_banner_show_credentials | bool)
         and (kommander_deploy_dashboard_credentials.rc | default(1)) == 0
         and banner_dashboard_user | length > 0 and banner_dashboard_password | length > 0 }}
    banner_dashboard_credentials: >-
      {{ ['Dashboard username: ' ~ banner_dashboard_user, 'Dashboard password: ' ~ banner_dashboard_password]
         if banner_dashboard_show | bool
         else ['Dashboard credentials (run on the jump host): nkp get dashboard --kubeconfig ' ~ cluster_kubeconfig] }}
    banner_access_head:
      - "{{ banner_rule }}"
      - "{{ 'NKP PREPROVISIONED CLUSTER DEPLOYED SUCCESSFULLY' if banner_all_ready | bool
            else 'NKP CLUSTER CREATED - KOMMANDER STILL CONVERGING ('
                 ~ ('' if banner_ingress_ready | bool else 'dashboard address not assigned yet, ')
                 ~ banner_apps_summary ~ ')' }}"
      - "{{ banner_rule }}"
      - "Jump Host Access:"
      - "  IP: {{ banner_jump_ip }}"
      - "  User: {{ ansible_user }}"
      - "  SSH: ssh {{ ansible_user }}@{{ banner_jump_ip }}"
      - "{{ banner_sep }}"
      - "Control Plane API VIP: https://{{ control_plane_vip }}:6443"
      - "{{ 'NKP Dashboard: https://' ~ banner_ingress_ip ~ '/dkp/kommander/dashboard' if banner_ingress_ready | bool
            else 'NKP Dashboard: pending - no external IP on service kommander/kommander-traefik after 10 minutes' }}"
    banner_access_tail:
      - "Kommander applications: {{ banner_apps_summary }}"
      - "Application status (run on the jump host): kubectl --kubeconfig {{ cluster_kubeconfig }} -n kommander get helmreleases"
      - "Kubeconfig on the jump host: {{ cluster_kubeconfig }}"
      - "{{ banner_sep }}"
    # Split rather than regex_search: on a non-match, regex_search with a
    # capture group raises on some ansible-core versions instead of returning
    # nothing.
    banner_license_tier: >-
      {{ ((kommander_deploy_license_status_out.stdout | default('', true)) ~ ' ')
         | regex_replace('^.*?tier=', '') | split(' ') | first
         if 'tier=' in (kommander_deploy_license_status_out.stdout | default('', true)) else '' }}
    banner_license_activated: >-
      {{ (kommander_deploy_license_status_out.rc | default(1)) == 0
         and banner_license_tier | length > 0 and banner_license_tier != 'Pro'
         and 'valid=true' in (kommander_deploy_license_status_out.stdout | default('', true)) }}
    banner_license_activated_lines:
      - "NKP LICENSE"
      - "{{ banner_sep }}"
      - "Cluster: {{ cluster_name }}"
      - "Cluster UUID (UID of the Cluster API cluster object): {{ banner_cluster_uuid }}"
      - "License status reported by the cluster: {{ banner_license_status }}"
      - "{{ 'An' if banner_license_tier is match('^[AEIOUaeiou]') else 'A' }} {{ banner_license_tier }} licence is activated on this cluster"
      - "(the dashboard shows its expiry and core usage under Global > Settings > Licensing)."
      - "This toolkit never applies or changes the licence."
      - "{{ banner_rule }}"
    banner_license_default_lines:
      - "NKP LICENSE"
      - "{{ banner_sep }}"
      - "Cluster: {{ cluster_name }}"
      - "Cluster UUID (UID of the Cluster API cluster object): {{ banner_cluster_uuid }}"
      - "License status reported by the cluster: {{ banner_license_status }}"
      - "Until a licence is activated the cluster runs on the default key NKP assigns (tier Pro, no license id,"
      - "zero capacity) and the dashboard reports that no license is activated. To activate yours:"
      - "  1. request an NKP Pro or Ultimate licence for the Cluster UUID above on the Nutanix Support Portal;"
      - "  2. in the NKP dashboard select Global > Settings > Licensing > Activate License and enter the key."
      - "This toolkit never applies or changes the licence."
      - "{{ banner_rule }}"

- name: Print cluster access details and summary banner (licence activated)
  ansible.builtin.debug:
    msg: "{{ kommander_deploy_banner_access + kommander_deploy_banner_license_activated_lines }}"
  when: kommander_deploy_banner_license_activated | bool

- name: Print cluster access details and summary banner (default licence key)
  ansible.builtin.debug:
    msg: "{{ kommander_deploy_banner_access + kommander_deploy_banner_license_default_lines }}"
  when: not (kommander_deploy_banner_license_activated | bool)
