---
# ==============================================================================
# Role Defaults: preflight
# ==============================================================================

# Size thresholds the hosts are checked against: the general resource
# requirements that the NKP guide (2.18 and 2.19) sets for Pro and Ultimate
# clusters.
# Pre-provisioned infrastructure requires an NKP Pro or Ultimate licence, so
# these are the requirements that apply; the toolkit does not create or size
# the machines, it only verifies them. A smaller lab may lower single values
# knowingly (platform applications may then lack resources).
# Memory thresholds sit slightly below the nominal size (8 / 16 / 32 GiB)
# because the kernel reports less than the RAM assigned to the machine.
preflight_jump_host_min_vcpus: 4
preflight_jump_host_min_mem_mb: 7500
preflight_control_plane_min_vcpus: 4
preflight_control_plane_min_mem_mb: 15000
preflight_worker_min_vcpus: 8
preflight_worker_min_mem_mb: 30000
# Lab shortcut only (local_volume_devices empty): the local volumes are
# directories under /var/local-disks on the workers, so each reports the size
# of the filesystem holding that path (/, or /var when it is a separate
# filesystem). Prometheus asks for a 100 GiB volume: a smaller filesystem
# leaves its claim pending.
preflight_worker_min_root_fs_gib: 105
# Smallest raw disk Rook Ceph accepts as OSD (ceph_osd_device). The local
# volume devices are checked against local_volume_min_gib (role "common").
preflight_ceph_osd_min_gib: 40
# Worker count of the guide table; fewer workers only produce a warning.
preflight_recommended_workers: 4
# Local volumes the platform applications claim on a new cluster (measured on
# NKP 2.18.0 and 2.19.0 with the default applications). Fewer local volume
# disks than this plus one spare per worker only produce a warning.
preflight_platform_local_volumes: 15

# Rocky Linux minor release listed by the pre-provisioned OS table of each NKP
# release. Another 9.x minor only produces a warning.
preflight_rocky_tested_minors:
  "2.18": "9.7"
  "2.19": "9.8"

# false skips the existence, checksum and content checks of the NKP CLI bundle
# on the control machine (set by verify_hosts.yml, which installs nothing).
preflight_check_nkp_cli: true

# Longest wait, in seconds, for cloud-init to finish on a freshly created host.
preflight_cloud_init_timeout: 1200

# Set to true to skip the "VIP unassigned" and "port 6443 free" checks when
# the cluster already exists but no kubeconfig is left on the control machine
# or on the jump host.
preflight_assume_existing_cluster: false
